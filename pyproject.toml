[project]
name = "event-ticketing"
version = "0.1.0"
description = "FastAPI event ticketing backend"
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "testcontainers>=4.15.0",
]
